name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-billing-tests:
    name: Build and Wedding billing policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run Wedding Square billing tests if present
        shell: bash
        run: |
          if [[ -f server/lib/wedding-square-billing-policy.test.ts ]]; then
            node --import tsx --test server/lib/wedding-square-billing-policy.test.ts
          else
            echo "Wedding Square billing policy tests not present."
          fi
          if [[ -f server/lib/wedding-square-enrollment-consent.test.ts ]]; then
            node --import tsx --test server/lib/wedding-square-enrollment-consent.test.ts
          else
            echo "Wedding Square enrollment consent tests not present."
          fi
      - name: Run Wedding Square sandbox enrollment preflight tests
        run: node --import tsx --test server/lib/wedding-square-enrollment-preflight.test.ts
      - name: Run Square subscription request safety tests
        run: node --import tsx --test server/lib/wedding-square-subscription-request.test.ts
      - name: Run Square durable enrollment attempt state tests
        run: node --import tsx --test server/lib/wedding-square-attempt-state.test.ts
      - name: Run Wedding enrollment persistence reservation tests
        run: node --import tsx --test server/lib/wedding-square-enrollment-reservation.test.ts
      - name: Run Wedding Square provider response verification tests
        run: node --import tsx --test server/lib/wedding-square-subscription-response.test.ts
      - name: Run Wedding Square submission-state safety tests
        run: node --import tsx --test server/lib/wedding-square-submission-state.test.ts
      - name: Verify persisted Wedding Square request fingerprints
        run: node --import tsx --test server/lib/wedding-square-claim-fingerprint.test.ts
      - name: Verify Square preclaim readiness safeguards
        run: node --import tsx --test server/lib/wedding-square-preclaim.test.ts
      - name: Test verified Square claim orchestration
        run: node --import tsx --test server/lib/wedding-square-verified-claim.test.ts
      - name: Test Square subscription confirmation persistence
        run: node --import tsx --test server/lib/wedding-square-confirmation-persistence.test.ts
      - name: Verify Square sandbox customer-card ownership tests
        run: node --import tsx --test server/lib/wedding-square-customer-card-ownership.test.ts
      - name: Test Square ownership and saved-attempt claim binding
        run: node --import tsx --test server/lib/wedding-square-ownership-claim.test.ts
      - name: Test Square confirmation coordinator
        run: node --import tsx --test server/lib/wedding-square-confirmation-coordinator.test.ts
      - name: Test one-shot sandbox Square subscription submitter and reconciliation gates
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-submitter.test.ts
      - name: Test raw Square sandbox CreateSubscription HTTP and SDK normalization regression
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-http.test.ts
      - name: Verify raw sandbox Square Customer and Card GET envelopes
        run: node --import tsx --test server/lib/wedding-square-sandbox-customer-card-api.test.ts
      - name: Verify owner-bound Neon and provider customer/card readback
        run: node --import tsx --test server/lib/wedding-square-owner-card-readback.test.ts
      - name: Test authenticated sandbox-only Wedding subscription submission HTTP
        run: node --import tsx --test server/routes/wedding-square-sandbox-submit.test.ts
      - name: Test Square enrollment reconciliation readback
        run: node --import tsx --test server/lib/wedding-square-reconciliation-readback.test.ts
      - name: Test Square provider reconciliation guard
        run: node --import tsx --test server/lib/wedding-square-provider-reconciliation.test.ts
      - name: Test trusted Square sandbox subscription readback
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-readback.test.ts
      - name: Test Square sandbox platform merchant and location attestation
        run: node --import tsx --test server/lib/wedding-square-sandbox-merchant-attestation.test.ts
      - name: Test Square sandbox catalog plan and price attestation
        run: node --import tsx --test server/lib/wedding-square-sandbox-catalog-attestation.test.ts
      - name: Test offline Square invoice/payment identity linkage
        run: node --import tsx --test server/lib/wedding-square-invoice-payment-linkage.test.ts
      - name: Test real Square SDK invoice/payment readback contract offline
        run: node --import tsx --test server/lib/wedding-square-invoice-payment-sdk-contract.test.ts
      - name: Test attested read-only Square subscription invoice order and payment chain
        run: node --import tsx --test server/lib/wedding-square-provider-payment-readback.test.ts
      - name: Test signed Wedding Square sandbox webhook intake and replay safety
        run: node --import tsx --test server/routes/wedding-square-webhook.test.ts
      - name: Build client and server
        run: npm run build

  wedding-square-postgres-migration-tests:
    name: Wedding Square PostgreSQL migration and Drizzle parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chefsire_wedding_test
          POSTGRES_USER: chefsire_test
          POSTGRES_PASSWORD: disposable_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chefsire_test -d chefsire_wedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      WEDDING_SQUARE_TEST_DATABASE_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
    steps:
      - name: Checkout reviewed PR code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify schema declaration coverage
        run: node --import tsx --test server/lib/schema-table-coverage.test.ts
      - name: Apply both Wedding Square migration files to a rollback-only PostgreSQL transaction and check constraints
        run: node --import tsx --test server/lib/wedding-square-migrations.postgres.test.ts
