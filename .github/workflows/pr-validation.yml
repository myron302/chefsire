  schema-push-path-postgres-tests:
    name: Schema push safety and plaintext finalization durability
    runs-on: ubuntu-latest
    # Both suites drive the REAL server/scripts/push-schema.ts (and so the real drizzle-kit) against a real
    # database, many times over: ~25 full pushes for the safety suite alone. That ran 17.6 min + 5.2 min
    # locally, which is why these two never fitted the 15-minute budget of the other PostgreSQL job and
    # were the last suites left outside CI. They get their own job rather than a raised ceiling on that one.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chefsire_wedding_test
          POSTGRES_USER: chefsire_test
          POSTGRES_PASSWORD: disposable_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chefsire_test -d chefsire_wedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
    steps:
      - name: Checkout reviewed PR code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      # Needs a role that may CREATE DATABASE: the suite builds its own throw-away database per run and
      # drops it afterwards, deliberately NOT named "*test*" so the guard treats it as a real database.
      - name: Verify the schema-push safety guard end to end against real drizzle-kit
        env:
          TEST_DATABASE_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/scripts/schema-push-safety.postgres.test.ts
      - name: Verify Square plaintext finalization survives every push path
        env:
          TEST_DATABASE_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/lib/square-plaintext-finalization-durability.postgres.test.ts
      - name: Migration safety validator and realtime engine origin guard
        # The validator is what refuses a destructive migration before it reaches the database, so it is the one
        # suite whose own failure would be silent everywhere else. It was out of CI until now.
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/scripts/migration-safety.test.ts server/realtime/engine-origin-guard.test.ts
      - name: Four suites that had never run in CI
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs client/src/pages/services/wedding-planning/weddingRegistry.test.ts client/src/lib/socket-lifecycle.test.ts server/routes/wedding-onboarding.test.ts server/routes/wedding-trial.test.ts
      - name: Square environment selection, including the one-policy structural guard
        # The guard that refuses a second Square sandbox/live policy. It was outside CI and failing: 42 files
        # read SQUARE_ENV directly. Its own failure would be silent everywhere else.
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/lib/square-environment-selection.test.ts
      - name: Drink collection premium access
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/routes/drink-collection-premium-access.test.ts
      - name: Drink builder create contract
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs client/src/pages/drinks/custom-drink-create-contract.test.ts
      - name: Recipe create persistence
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node server/scripts/run-ci-batch.mjs server/lib/recipe-create-persistence.postgres.test.ts

