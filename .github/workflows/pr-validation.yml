name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-billing-tests:
    name: Build and Wedding billing policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Test Marketplace checkout and private file isolation
        run: node --import tsx --test client/src/components/SquarePaymentForm.test.ts shared/marketplace-fulfillment.test.ts shared/marketplace-sample.test.ts shared/marketplace-order-status.test.ts client/src/components/feed-widgets-endpoints.test.ts client/src/pages/signed-out-prompts.test.ts client/src/lib/signup-username.test.ts shared/phone.test.ts client/src/pages/auth/phone-ui.test.ts server/routes/marketplace-checkout-atomicity.test.ts server/routes/marketplace-payment-fulfillment.test.ts server/routes/upload-active-content.test.ts
      - name: Test public avatar projection and inline avatar serving
        run: node --import tsx --test server/lib/inline-avatar.test.ts
      - name: Test Cookoff Arena stats and image placeholder fallback
        run: node --import tsx --test client/src/pages/competitions/competition-library-stats.test.ts client/src/pages/competitions/competition-room-rules.test.ts
      - name: Test wedding vendor directory mapping
        run: node --import tsx --test client/src/pages/services/lib/wedding-vendors.test.ts client/src/pages/drinks/no-fake-popularity.test.ts
      - name: Test hosted invoice payment ownership
        run: node --import tsx --test server/lib/wedding-square-invoice-payment-customer.test.ts
      - name: Test owner-scoped sandbox checkout eligibility
        run: node --import tsx --test server/lib/wedding-square-checkout-eligibility.test.ts server/lib/wedding-square-sandbox-tester.test.ts
      - name: Preserve Wedding checkout across Settings renders
        run: node --import tsx --test client/src/pages/settings-subscription-state.test.ts
      - name: Test authenticated Square sandbox card setup HTTP
        run: node --import tsx --test server/routes/wedding-square-sandbox-card-setup.test.ts
      - name: Test Neon owner-bound Square card setup coordinator
        run: node --import tsx --test server/lib/wedding-square-card-setup-coordinator.test.ts
      - name: Test one-shot Square sandbox Customer/Card transport
        run: node --import tsx --test server/lib/wedding-square-sandbox-card-setup-transport.test.ts
      - name: Test real-provider smoke gate without making provider calls
        run: node --import tsx --test server/scripts/wedding-square-sandbox-provider-smoke.test.ts
      - name: Test Square sandbox webhook signal drain
        run: node --import tsx --test server/lib/wedding-square-webhook-drain.test.ts
      - name: Test event-specific payment and refund reconciliation
        run: node --import tsx --test server/lib/wedding-square-payment-events.test.ts server/lib/wedding-square-refund-readback.test.ts server/lib/wedding-square-dispute-readback.test.ts
      - name: Test exact subscription and invoice lifecycle notification handling
        run: node --import tsx --test server/lib/wedding-square-lifecycle-events.test.ts
      - name: Test existing subscription payment-method recovery
        run: node --import tsx --test server/lib/wedding-square-card-update.test.ts server/lib/wedding-square-card-update-transport.test.ts server/routes/wedding-square-card-update.test.ts
      - name: Test Wedding Square lifecycle evidence report
        run: node --test scripts/wedding-square-acceptance-evidence.test.mjs
      - name: Test Wedding Square readiness audit
        run: node --test scripts/wedding-square-sandbox-readiness.test.mjs
      - name: Test private sandbox fixture safety guards without provider requests
        run: node --test operator/square-sandbox-fixtures.guard.test.cjs
      - name: Run Wedding Square billing tests if present
        shell: bash
        run: |
          if [[ -f server/lib/wedding-square-billing-policy.test.ts ]]; then
            node --import tsx --test server/lib/wedding-square-billing-policy.test.ts
          else
            echo "Wedding Square billing policy tests not present."
          fi
          if [[ -f server/lib/wedding-square-enrollment-consent.test.ts ]]; then
            node --import tsx --test server/lib/wedding-square-enrollment-consent.test.ts
          else
            echo "Wedding Square enrollment consent tests not present."
          fi
      - name: Run Wedding Square sandbox enrollment preflight tests
        run: node --import tsx --test server/lib/wedding-square-enrollment-preflight.test.ts
      - name: Run Square subscription request safety tests
        run: node --import tsx --test server/lib/wedding-square-subscription-request.test.ts
      - name: Run Square durable enrollment attempt state tests
        run: node --import tsx --test server/lib/wedding-square-attempt-state.test.ts
      - name: Run Wedding enrollment persistence reservation tests
        run: node --import tsx --test server/lib/wedding-square-enrollment-reservation.test.ts
      - name: Run Wedding Square provider response verification tests
        run: node --import tsx --test server/lib/wedding-square-subscription-response.test.ts
      - name: Run Wedding Square submission-state safety tests
        run: node --import tsx --test server/lib/wedding-square-submission-state.test.ts
      - name: Verify persisted Wedding Square request fingerprints
        run: node --import tsx --test server/lib/wedding-square-claim-fingerprint.test.ts
      - name: Verify Square preclaim readiness safeguards
        run: node --import tsx --test server/lib/wedding-square-preclaim.test.ts
      - name: Test verified Square claim orchestration
        run: node --import tsx --test server/lib/wedding-square-verified-claim.test.ts
      - name: Test Square subscription confirmation persistence
        run: node --import tsx --test server/lib/wedding-square-confirmation-persistence.test.ts
      - name: Verify Square sandbox customer-card ownership tests
        run: node --import tsx --test server/lib/wedding-square-customer-card-ownership.test.ts
      - name: Test Square ownership and saved-attempt claim binding
        run: node --import tsx --test server/lib/wedding-square-ownership-claim.test.ts
      - name: Test Square confirmation coordinator
        run: node --import tsx --test server/lib/wedding-square-confirmation-coordinator.test.ts
      - name: Test one-shot sandbox Square subscription submitter and reconciliation gates
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-submitter.test.ts
      - name: Test raw Square sandbox CreateSubscription HTTP and SDK normalization regression
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-http.test.ts
      - name: Verify raw sandbox Square Customer and Card GET envelopes
        run: node --import tsx --test server/lib/wedding-square-sandbox-customer-card-api.test.ts
      - name: Verify owner-bound Neon and provider customer/card readback
        run: node --import tsx --test server/lib/wedding-square-owner-card-readback.test.ts
      - name: Test authenticated sandbox-only Wedding subscription submission HTTP
        run: node --import tsx --test server/routes/wedding-square-sandbox-submit.test.ts
      - name: Test sandbox Square cancellation raw HTTP verification
        run: node --import tsx --test server/lib/wedding-square-sandbox-cancel-transport.test.ts
      - name: Test owner-bound one-shot sandbox Square cancellation state
        run: node --import tsx --test server/lib/wedding-square-sandbox-cancellation.test.ts
      - name: Test authenticated sandbox cancellation HTTP gate
        run: node --import tsx --test server/routes/wedding-square-sandbox-cancel.test.ts
      - name: Verify Wedding Square paid entitlement requires trusted provider evidence
        run: node --import tsx --test server/lib/wedding-square-paid-entitlement.test.ts
      - name: Validate owner-scoped Wedding billing management status
        run: node --import tsx --test server/lib/wedding-square-billing-status.test.ts
      - name: Validate private authenticated Wedding billing status HTTP
        run: node --import tsx --test server/routes/wedding-square-billing-status.test.ts
      - name: Validate no local-only Wedding cancellation with unresolved Square billing
        run: node --import tsx --test server/lib/wedding-square-legacy-cancel-guard.test.ts
      - name: Preserve cardless Wedding trial when paid evidence is unavailable
        run: node --import tsx --test server/lib/wedding-entitlement-square-evidence.test.ts
      - name: Test Square enrollment reconciliation readback
        run: node --import tsx --test server/lib/wedding-square-reconciliation-readback.test.ts
      - name: Test Square provider reconciliation guard
        run: node --import tsx --test server/lib/wedding-square-provider-reconciliation.test.ts
      - name: Test trusted Square sandbox subscription readback
        run: node --import tsx --test server/lib/wedding-square-sandbox-subscription-readback.test.ts
      - name: Test Square sandbox platform merchant and location attestation
        run: node --import tsx --test server/lib/wedding-square-sandbox-merchant-attestation.test.ts
      - name: Test Square sandbox catalog plan and price attestation
        run: node --import tsx --test server/lib/wedding-square-sandbox-catalog-attestation.test.ts
      - name: Test offline Square invoice/payment identity linkage
        run: node --import tsx --test server/lib/wedding-square-invoice-payment-linkage.test.ts
      - name: Test real Square SDK invoice/payment readback contract offline
        run: node --import tsx --test server/lib/wedding-square-invoice-payment-sdk-contract.test.ts
      - name: Test attested read-only Square subscription invoice order and payment chain
        run: node --import tsx --test server/lib/wedding-square-provider-payment-readback.test.ts
      - name: Test raw Square payment refund and complete dispute page readback
        run: node --import tsx --test server/lib/wedding-square-sandbox-payment-risk-api.test.ts
      - name: Test owner-bound subscription price and provider risk audit
        run: node --import tsx --test server/lib/wedding-square-billing-audit.test.ts
      - name: Verify Square period readback
        run: node --import tsx --test server/lib/wedding-square-period-readback.test.ts
      - name: Test sandbox invoice evidence transaction controls
        run: node --import tsx --test server/lib/wedding-square-evidence-ledger.test.ts
      - name: Verify owner payment evidence refresh
        run: node --import tsx --test server/lib/wedding-square-evidence-refresh.test.ts
      - name: Test bounded Wedding Square reconciliation batch
        run: node --import tsx --test server/lib/wedding-square-reconciliation-batch.test.ts
      - name: Test owner-verified PENDING to ACTIVE Square first-charge transition
        run: node --import tsx --test server/lib/wedding-square-renewal-activation.test.ts
      - name: Test Wedding Square renewal invoice discovery
        run: node --import tsx --test server/lib/wedding-square-renewal-scan.test.ts
      - name: Test signed Wedding Square sandbox webhook intake and replay safety
        run: node --import tsx --test server/routes/wedding-square-webhook.test.ts
      - name: Verify auth entry and unavailable social sign-in
        run: node --import tsx --test client/src/components/auth-entry.test.tsx server/routes/google-oauth-state.test.ts
      - name: Build client and server
        run: npm run build

  wedding-square-postgres-migration-tests:
    name: Wedding Square PostgreSQL migration and Drizzle parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chefsire_wedding_test
          POSTGRES_USER: chefsire_test
          POSTGRES_PASSWORD: disposable_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chefsire_test -d chefsire_wedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      WEDDING_SQUARE_TEST_DATABASE_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
    steps:
      - name: Checkout reviewed PR code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Test buyer and seller Marketplace order journey
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node --import tsx --test --test-concurrency=1 server/routes/marketplace-order-journey.postgres.test.ts server/routes/marketplace-sample-listings.postgres.test.ts server/routes/marketplace-fulfillment-status.postgres.test.ts server/routes/marketplace-order-detail-access.postgres.test.ts
      - name: Test wedding vendor directory and quote delivery against PostgreSQL
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node --import tsx --test --test-concurrency=1 server/routes/wedding-vendor-quotes.postgres.test.ts server/routes/wedding-vendor-claims.postgres.test.ts server/routes/wedding-vendor-legacy-table.postgres.test.ts server/routes/wedding-budget-settings.postgres.test.ts
      - name: Verify schema declaration coverage
        run: node --import tsx --test server/lib/schema-table-coverage.test.ts
      - name: Apply both Wedding Square migration files to a rollback-only PostgreSQL transaction and check constraints
        run: node --import tsx --test server/lib/wedding-square-migrations.postgres.test.ts
      - name: Verify signed webhook persistence, duplicates and retryable failures on PostgreSQL
        run: node --import tsx --test server/routes/wedding-square-webhook.postgres.test.ts
      - name: Verify atomic Wedding provider confirmation and subscription ledger on PostgreSQL 16
        run: node --import tsx --test server/lib/wedding-square-confirmation-persistence.postgres.test.ts
      - name: Verify paid Wedding entitlements from real invoice evidence on PostgreSQL 16
        run: node --import tsx --test server/lib/wedding-square-paid-entitlement.postgres.test.ts
      - name: Test atomic provider invoice evidence recording on PostgreSQL 16
        run: node --import tsx --test server/lib/wedding-square-evidence-ledger.postgres.test.ts
      - name: Verify invoice refresh on PostgreSQL
        run: node --import tsx --test server/lib/wedding-square-evidence-refresh.postgres.test.ts
      - name: Verify exact payment/refund event transactions on PostgreSQL
        run: node --import tsx --test server/lib/wedding-square-payment-events.postgres.test.ts
      - name: Verify exact lifecycle acknowledgement without paid grant on PostgreSQL
        run: node --import tsx --test server/lib/wedding-square-lifecycle-events.postgres.test.ts
      - name: Verify durable card replacement and GET-only recovery on PostgreSQL
        run: node --import tsx --test server/lib/wedding-square-card-update.postgres.test.ts
      - name: Test Wedding Square reconciliation batch PostgreSQL
        run: node --import tsx --test server/lib/wedding-square-reconciliation-batch.postgres.test.ts
      - name: Test Wedding Square renewal discovery on PostgreSQL 16
        run: node --import tsx --test server/lib/wedding-square-renewal-scan.postgres.test.ts
      - name: Verify legacy Wedding cancellation guard against real unresolved provider records
        run: node --import tsx --test server/lib/wedding-square-legacy-cancel-guard.postgres.test.ts

      - name: Verify Google email ownership and legacy tester reclamation on isolated PostgreSQL
        env:
          CS_TEST_PG_URL: postgres://chefsire_test:disposable_test_password@127.0.0.1:5432/chefsire_wedding_test
        run: node --import tsx --test --test-concurrency=1 server/routes/auth-account-prehijack.test.ts server/routes/auth-login-username.postgres.test.ts server/routes/auth-login-phone.postgres.test.ts
