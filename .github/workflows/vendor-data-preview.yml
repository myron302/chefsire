name: Vendor data preview (read-only)

# Pulls Connecticut wedding-vendor candidates from the free, openly licensed Overture Maps Places dataset
# and uploads them as a CSV artifact for review. It never connects to the ChefSire database.
on:
  workflow_dispatch:
  push:
    branches: [claude/vendor-data-preview]
    paths: [scripts/vendor-import/**, .github/workflows/vendor-data-preview.yml]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Find latest Overture release
        id: rel
        run: |
          REL=$(aws s3 ls s3://overturemaps-us-west-2/release/ --no-sign-request | awk '{print $2}' | tr -d / | sort | tail -1)
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "Using Overture release $REL"
      - name: Extract CT candidates
        run: python scripts/vendor-import/extract_overture_ct.py "${{ steps.rel.outputs.release }}" out
      - run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ct-wedding-vendors
          path: out/
