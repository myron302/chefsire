name: Vendor data extract (read-only)

# Pulls Connecticut wedding vendors from the free, openly licensed Overture Maps Places dataset and commits
# server/data/wedding-vendors-ct.json to the branch it ran on. It never connects to the ChefSire database.
# Run it manually (Actions > Run workflow) to refresh the data from the latest monthly Overture release.
on:
  workflow_dispatch:
  push:
    branches: [claude/vendor-data-preview]
    paths: [scripts/vendor-import/**, .github/workflows/vendor-data-preview.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Find latest Overture release
        id: rel
        run: |
          REL=$(aws s3 ls s3://overturemaps-us-west-2/release/ --no-sign-request | awk '{print $2}' | tr -d / | sort | tail -1)
          echo "release=$REL" >> "$GITHUB_OUTPUT"
      - name: Extract CT vendors
        run: python scripts/vendor-import/extract_overture_ct.py "${{ steps.rel.outputs.release }}" out
      - run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit data file
        run: |
          mkdir -p server/data
          cp out/wedding-vendors-ct.json server/data/wedding-vendors-ct.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/wedding-vendors-ct.json
          git diff --cached --quiet || git commit -m "Update CT wedding vendor data (Overture ${{ steps.rel.outputs.release }})"
          git push
